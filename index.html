<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест по автоматизации — 12 вариантов</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#1f2937;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px}
.header{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 14px rgba(0,0,0,.08);margin-bottom:14px}
h1{margin:0 0 8px;font-size:25px}
.sub{color:#667085}
.variants{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
.vbtn,.action{border:1px solid #cfd4dc;background:#f8fafc;border-radius:10px;padding:11px 8px;font-weight:700;cursor:pointer;font-size:15px}
.vbtn:hover,.action:hover{background:#eef2f6}
.vbtn.active{background:#20262e;color:#fff;border-color:#20262e}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.action{background:#fff}
.info{margin-left:auto;font-weight:700}
#test{display:none}
.question{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 9px rgba(0,0,0,.06)}
.qtitle{font-weight:700;line-height:1.45;margin-bottom:12px}
.option{display:block;width:100%;text-align:left;border:1px solid #d7dce2;background:#fff;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;font-size:15px;line-height:1.4}
.option:hover{background:#f5f7f9}
.option.selected{border-color:#222;background:#eef1f4}
.option.correct{border-color:#198754;background:#eaf7ef}
.option.wrong{border-color:#dc3545;background:#fff0f1}
.letter{font-weight:800;margin-right:7px}
.result{display:none;background:#fff;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 2px 9px rgba(0,0,0,.06);font-size:18px;font-weight:700}
.progress{height:8px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;width:0;background:#20262e;transition:.2s}
@media(max-width:650px){.variants{grid-template-columns:repeat(3,1fr)}.info{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Тест по автоматизации</h1>
    <div class="sub">240 вопросов · 12 вариантов · по 20 вопросов в каждом</div>
    <div class="variants" id="variants"></div>
  </div>

  <div id="test">
    <div class="toolbar">
      <button class="action" onclick="checkTest()">Проверить ответы</button>
      <button class="action" onclick="resetCurrent()">Сбросить ответы</button>
      <div class="info" id="info"></div>
    </div>
    <div class="progress"><div id="progress"></div></div>
    <div id="questions"></div>
    <div class="result" id="result"></div>
  </div>
</div>

const LETTERS = ["A","B","C","D","E"];
let currentVariant = 1;
let current = [];
let answers = {};

function seeded(seed){
  let t = seed >>> 0;
  return function(){
    t += 0x6D2B79F5;
    let x=t;
    x=Math.imul(x^(x>>>15),x|1);
    x^=x+Math.imul(x^(x>>>7),x|61);
    return ((x^(x>>>14))>>>0)/4294967296;
  }
}
function shuffle(arr,rng){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function buildVariant(v){
  const start=(v-1)*20;
  const base=BANK.slice(start,start+20);
  const rng=seeded(100000+v*7919);
  return base.map(item=>{
    let indices=item.opts.map((_,i)=>i);
    // Перемешиваем варианты и не допускаем сохранения исходной позиции правильного ответа.
    for(let tries=0;tries<20;tries++){
      indices=shuffle(item.opts.map((_,i)=>i),rng);
      if(indices.indexOf(item.correct)!==item.correct || item.opts.length===1) break;
    }
    return {...item, order:indices};
  });
}
function renderVariants(){
  const box=document.getElementById("variants");
  box.innerHTML="";
  for(let i=1;i<=12;i++){
    const b=document.createElement("button");
    b.className="vbtn"+(i===currentVariant?" active":"");
    b.textContent="Вариант "+i;
    b.onclick=()=>selectVariant(i);
    box.appendChild(b);
  }
}
function selectVariant(v){
  currentVariant=v;
  renderVariants();
  current=buildVariant(v);
  answers={};
  document.getElementById("test").style.display="block";
  document.getElementById("result").style.display="none";
  document.getElementById("info").textContent="Вариант "+v+" · вопросы "+current[0].n+"–"+current[current.length-1].n;
  renderQuestions();
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderQuestions(){
  const root=document.getElementById("questions");
  root.innerHTML="";
  current.forEach((item,qi)=>{
    const card=document.createElement("div");
    card.className="question";
    const title=document.createElement("div");
    title.className="qtitle";
    title.textContent=(qi+1)+". "+item.q;
    card.appendChild(title);
    item.order.forEach((origIdx,pos)=>{
      const b=document.createElement("button");
      b.className="option";
      b.dataset.q=qi;
      b.dataset.pos=pos;
      b.innerHTML='<span class="letter">'+LETTERS[pos]+")</span>"+escapeHtml(item.opts[origIdx]);
      b.onclick=()=>choose(qi,pos);
      card.appendChild(b);
    });
    root.appendChild(card);
  });
  updateProgress();
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function choose(qi,pos){
  answers[qi]=pos;
  document.querySelectorAll('.option[data-q="'+qi+'"]').forEach(b=>b.classList.remove("selected"));
  const chosen=document.querySelector('.option[data-q="'+qi+'"][data-pos="'+pos+'"]');
  if(chosen) chosen.classList.add("selected");
  updateProgress();
}
function updateProgress(){
  const done=Object.keys(answers).length;
  document.getElementById("progress").style.width=(done/current.length*100)+"%";
}
function checkTest(){
  let score=0;
  current.forEach((item,qi)=>{
    const correctPos=item.order.indexOf(item.correct);
    document.querySelectorAll('.option[data-q="'+qi+'"]').forEach(b=>{
      const p=Number(b.dataset.pos);
      b.classList.remove("correct","wrong");
      if(p===correctPos)b.classList.add("correct");
      if(answers[qi]===p && p!==correctPos)b.classList.add("wrong");
    });
    if(answers[qi]===correctPos)score++;
  });
  const r=document.getElementById("result");
  r.style.display="block";
  r.textContent="Результат: "+score+" из "+current.length+" ("+Math.round(score/current.length*100)+"%)";
  r.scrollIntoView({behavior:"smooth",block:"center"});
}
function resetCurrent(){
  answers={};
  document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected","correct","wrong"));
  document.getElementById("result").style.display="none";
  updateProgress();
}
renderVariants();
selectVariant(1);
</script>
